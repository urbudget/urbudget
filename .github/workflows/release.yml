# Builds UrBudget's installers on GitHub's machines and attaches them to a draft release:
# a signed, notarized macOS .dmg (Apple Silicon and Intel in one app), the Windows installer,
# and the Microsoft Store package (.msix).
# Run it from the Actions tab (Release → Run workflow) or by pushing a tag such as desktop-v1.0.8
# for the version in desktop/ (`node scripts/versions.mjs desktop 1.0.8` sets it; RELEASING.md).
# Android and iOS have their own tags and workflows. Desktop's earlier releases are tagged v1.0.7.
# Signing uses the repository secrets that `node desktop/scripts/mac-signing.mjs` stores, and
# TAURI_SIGNING_PRIVATE_KEY, the updater key that signs the update packages installed copies fetch
# (desktop/README.md › The updater signing key). Without it the build stops.
# Publishing the draft release puts the installers on urbudget.app (publish.yml).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  updater:
    name: Updater regressions
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - name: Type-check and build the frontend assets
        run: npm run build
      - name: Exercise update state, interruptions, and saving before close
        run: npm run test:ui -- src/updates.test.tsx src/updates.stress.test.tsx src/useBudget.test.tsx src/App.test.tsx --maxWorkers 2
      - name: Exercise native Store update states
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "updates::"
      - name: Exercise real updater HTTP failures and package verification
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test updater_transport
      # These checks cannot establish Store eligibility, consent, or deployment. Before
      # publication, also run the two-version package-flight check in desktop/README.md.

  build:
    needs: updater
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/versions.mjs --tag "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: the bundler imports the certificate into a temporary keychain, signs the app,
          # then sends it to Apple for notarization. Unused on Windows.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The updater key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: UrBudget __VERSION__
          # Publishing the draft puts the installers on urbudget.app (publish.yml); write what's
          # new here first, and it shows on the download page.
          releaseBody: ""
          releaseDraft: true
          # urbudget.app serves updates (publish.yml), not a latest.json on GitHub.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # The same NSIS bytes tauri-action attached to the draft, transferred without draft-write access.
      - name: Preserve the Windows installer for isolated smoke
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-installer-${{ github.run_id }}
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Windows: the same build packed as an MSIX for the Microsoft Store (unsigned; the Store
      # signs it). Upload it in Partner Center → UrBudget → submission → Packages.
      - name: Pack the Microsoft Store package
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        run: node scripts/pack-msix.mjs

      - name: Attach the Store package to the release
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "desktop-v$version" "src-tauri/target/msix/UrBudget_${version}_x64.msix" --clobber

  windows-smoke:
    name: Installed Windows release smoke
    # Wait for both installer jobs; use the same NSIS output attached to the draft release.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated runner evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'urbudget-release-smoke-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          'Installer smoke has not run yet.' | Set-Content (Join-Path $evidence 'started.txt')
      - name: Download the exact Windows release installer
        uses: actions/download-artifact@v4
        with:
          name: windows-release-installer-${{ github.run_id }}
          path: ${{ runner.temp }}/urbudget-release-smoke-download/
      - name: Locate the release installer
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $download = Join-Path $env:RUNNER_TEMP 'urbudget-release-smoke-download'
          $installers = @(Get-ChildItem -LiteralPath $download -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows release installer.' }
          "SMOKE_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SMOKE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify installed release assets and local persistence
        timeout-minutes: 4
        shell: pwsh
        run: |
          node desktop/scripts/qa/release-windows.mjs --installer "$env:SMOKE_INSTALLER" --version "$env:SMOKE_VERSION" --evidence "$env:RUNNER_TEMP/urbudget-release-smoke-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/urbudget-release-smoke-evidence/
          if-no-files-found: error
          retention-days: 14
