# Tests the native iOS app when its code changes: the Rust adapter on Linux, then the app on the
# iOS Simulator. Shared engine and service changes also run the Simulator: storage/sync contracts
# can break native lifecycle behavior without changing an iOS source file.
# ios-release.yml runs the Simulator tests again before every upload.
name: Native iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", "!ios/**/*.md", "crates/urbudget-ios/**", "crates/urbudget-core/**", "crates/urbudget-services/**", "crates/Cargo.toml", "crates/Cargo.lock", ".github/workflows/ios-native.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**", "!ios/**/*.md", "crates/urbudget-ios/**", "crates/urbudget-core/**", "crates/urbudget-services/**", "crates/Cargo.toml", "crates/Cargo.lock", ".github/workflows/ios-native.yml"]

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      - run: cargo test --locked --manifest-path crates/Cargo.toml -p urbudget-ios

  ios:
    needs: bridge
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      - name: Test on the iOS Simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")))')
          # Ad-hoc signing ("Sign to Run Locally") gives the simulator app its Keychain, as on a Mac.
          xcodebuild -project ios/UrBudget.xcodeproj -scheme UrBudget -destination "id=$device" \
            -derivedDataPath build -IDEBuildingContinueBuildingAfterErrors=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- test
      - name: Build for devices (unsigned)
        run: |
          xcodebuild -project ios/UrBudget.xcodeproj -scheme UrBudget -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
