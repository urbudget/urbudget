[package]
name = "urbudget-ios"
version = "1.0.11"
description = "Versioned JSON/C adapter for the native UrBudget iOS app"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "urbudget_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
urbudget-services = { path = "../urbudget-services" }
# The engine transport is host-neutral; Android's crate only adds JNI on Android targets.
urbudget-android = { path = "../urbudget-android" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
