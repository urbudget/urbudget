[package]
name = "urbudget-android"
version = "1.0.10"
description = "Versioned JSON/JNI adapter for the native UrBudget Android app"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "urbudget_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
urbudget-core = { path = "../urbudget-core" }
urbudget-services = { path = "../urbudget-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
urbudget-core = { path = "../urbudget-core", features = ["test-support"] }
