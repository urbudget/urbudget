[package]
name = "urbudget"
version = "1.0.11"
description = "A private, local envelope budget"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "urbudget_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# At least 2.14: it enforces plugins.updater.requireSignedVersion, which older ones (2.9) ignore.
tauri-plugin-updater = "2.14"
# The save panel for exports, opened from Rust only (save.rs): the window gets no dialog permissions.
tauri-plugin-dialog = "2.8"
urbudget-core = { path = "../../crates/urbudget-core" }
urbudget-services = { path = "../../crates/urbudget-services" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
calamine = { version = "0.36.1", features = ["dates"] }
rust_xlsxwriter = "0.99.1"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
flate2 = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
urbudget-core = { path = "../../crates/urbudget-core", features = ["test-support"] }
tempfile = "3"

# JSON and SQLite work in dependencies dominates run time; keep `npm run desktop` responsive.
[profile.dev.package."*"]
opt-level = 3

# The Keychain (vault.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# DPAPI seals the secrets' key, Credential Manager holds earlier versions' secrets (vault.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Services_Store", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3"
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_Packaging_Appx", "Win32_System_Recovery", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-core = "0.62"
